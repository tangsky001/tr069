# =============================================================================
# 工单模板示例：新增一条 WAN 连接
# -----------------------------------------------------------------------------
# 文件位置决定了工单归属，层级为：
#   operators/{isp}/{version}/{domain}/{deviceType}/{name}.yaml
# 本文件路径等价于：
#   isp=CT  version=v3.0  domain=business  deviceType=ADSL_4+1  name=WAN_ADD
#
# 保存后自动热加载，无需重启。
# =============================================================================

# 工单名称，缺省取文件名
name: WAN_ADD
# 是否启用
enabled: true
# 执行优先级，数值越小越先执行
priority: 100
# 工单说明，管理端会展示给操作员
doc: |
  新增一条 WAN 连接。
  连接类型、业务列表、账号密码由下发时指定。

# -----------------------------------------------------------------------------
# 工单参数定义
#   order 决定表单中的排列顺序
#   ${参数名} 可在下方 steps 中引用
# -----------------------------------------------------------------------------
args:
  ConnectionType:
    defaultValue: IP_Routed
    order: 1
    required: true
    type: enum
    enumValues:
      - IP_Routed
      - IP_Bridged
      - PPPoE_Routed
    description: WAN 连接的类型
  ServiceList:
    defaultValue: INTERNET
    order: 2
    required: true
    type: string
    description: 业务列表
  Username:
    defaultValue: admin
    order: 3
    required: false
    type: string
    description: 拨号用户名，PPPoE 时使用
  Password:
    defaultValue: admin
    order: 4
    required: false
    type: string
    description: 拨号口令
  Enable:
    defaultValue: "true"
    order: 5
    required: true
    type: boolean
    description: 是否启用该连接

# -----------------------------------------------------------------------------
# 执行步骤，按顺序串行下发到设备
#   ${参数名}  引用上面的工单参数
#   ${ctx.变量} 引用前序步骤 saveAs 存入上下文的结果
# -----------------------------------------------------------------------------
steps:
  - comment: 创建 WAN 连接实例
    rpc: AddObject
    objectName: ${WANConnectionDevice}
    # 把设备返回的新实例号存入上下文，后续步骤用 ${ctx.wanInstance} 引用
    saveAs: wanInstance
    abortOnError: true

  - comment: 下发连接参数
    rpc: SetParameterValues
    parameters:
      - name: ${WANConnectionDevice}.${ctx.wanInstance}.WANIPConnection.ConnectionType
        value: ${ConnectionType}
      - name: ${WANConnectionDevice}.${ctx.wanInstance}.WANIPConnection.X_CT-COM_ServiceList
        value: ${ServiceList}
      - name: ${WANConnectionDevice}.${ctx.wanInstance}.WANIPConnection.Username
        value: ${Username}
      - name: ${WANConnectionDevice}.${ctx.wanInstance}.WANIPConnection.Password
        value: ${Password}
      - name: ${WANConnectionDevice}.${ctx.wanInstance}.WANIPConnection.Enable
        value: ${Enable}
    abortOnError: true
