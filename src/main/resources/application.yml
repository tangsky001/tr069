server:
  port: 8888

spring:
  application:
    name: PilotACS
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/acs?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 生产环境用环境变量覆盖（ACS_DB_USERNAME / ACS_DB_PASSWORD），冒号后为本地开发默认值
    username: ${ACS_DB_USERNAME:root}
    password: ${ACS_DB_PASSWORD:Qq123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 对外公布的主机地址：内网登录二维码用它 + 管理端端口拼链接
acs:
  public-host: 127.0.0.1
  group:
    # 启动时自动补建 res_group_member 表
    auto-create-table: true
  olt:
    # 启动时自动补建表
    auto-create-table: true
    # 建连超时(毫秒)
    connect-timeout-ms: 8000
    # 登录超时(毫秒)，含等待账号/密码提示符
    login-timeout-ms: 15000
    # 单条命令等待提示符的超时(毫秒)
    command-timeout-ms: 20000
    # 每条命令的完整回显是否打进日志，true=开启
    log-echo: false
    # 单次采集留档的回显上限(字符)，超出截断
    max-raw-output-chars: 60000
  cpe:
    # 设备侧 ACS URL 指向的路径列表（不带 /api，设备直连），每个路径都挂 CWMP 端点；
    # CPE 端口上的任意其他路径（含不带路径的 http://host:9090/?sn=xxx）自动转发到第一个路径；
    # 主端口 8888 上命中这些路径的请求一律拒绝，主端口只服务管理端 REST API。
    paths: /acs,/ACS-server/ACS,/ACS-server/acs,/ACS-server/ACS-server,/ACS,/cwmp,/CWMP,/tr069,/TR069,/CPE,/cpe,/CPE-server,/CPE-server/cpe,/CPE-server/CPE,/CPE-server/CPE-server,/push
    # CPE 独立监听端口（不同厂商设备配置的 ACS 端口不同）；
    # 不占用 server 主端口 8888，主端口上的 CWMP 路径会被拒绝。
    ports: 9090,8080,8012,6060,5481,9092,6890,9095,7013
    # ACS 侧 Basic 认证账号，留空则不校验
    auth-username: ""
    auth-password: ""
    # 会话空闲超时（秒）
    session-timeout-seconds: 60
    # 单会话最大 RPC 往返数（防失控）
    max-rpc-count: 255
    # GetParameterValues 单批参数个数
    gpv-batch-size: 32
    # 设备参数树/机型模板库（template.pack 随包内置 resources/data，首次启动释放到运行目录）
    sqlite-path: data/template.pack
    # 台账/任务表是否启动时自动补建（MySQL，DDL 与 sql/mysql.sql 一致）
    auto-create-table: true
    # 反向连接（Connection Request）账号密码与超时
    # 生产环境用环境变量覆盖（ACS_CR_USERNAME / ACS_CR_PASSWORD），避免弱默认凭据
    cr-username: ${ACS_CR_USERNAME:itsm}
    cr-password: ${ACS_CR_PASSWORD:itsm}
    cr-timeout-ms: 3000
    # 首次上报自动下发的周期 Inform 间隔（秒）
    init-periodic-inform-seconds: 300
    # 同步采集类接口等待设备回参的最大秒数
    collect-timeout-seconds: 120
    # SPV 下发受理成功后回读校验（追加 verify GPV 步，比对设备实际生效值，偏差记进任务结果）
    spv-readback: true
    # 会话生命周期 Redis TTL（秒）：cpe:session:{sn} 过期即会话销毁（仅合法报文续期，防僵尸会话）
    session-ttl-seconds: 180
    # CWMP 报文体积上限（字节），超出直接拒绝（Netty 聚合器硬切，防大报文 DoS）
    max-body-bytes: 1048576
    # SN 粒度令牌桶限流（cpe:limit:token:{sn}，风暴报文拦在 Redis 会话之外）
    # 限流只作用于"无会话"的洪泛报文（建会话前的风暴保护，会话内往返不消耗令牌）
    rate-limit-enabled: true
    rate-limit-capacity: 20
    rate-limit-refill-per-minute: 30
    # 设备档案缓存 cpe:info:{sn} TTL（秒），Inform 落台账时同步覆写
    device-info-ttl-seconds: 600
    # 参数树缓存 cpe:params:tree:{sn} TTL（秒），落库时主动失效，TTL 只作兜底
    param-tree-ttl-seconds: 600
    # Redis 派发队列 tr069:queue:rpc 长度上限（LTRIM 封顶，防堆积膨胀）
    task-queue-max-size: 10000
  sip:
    # SIP 软交换总开关（默认开启）关闭=false
    enabled: true
    # SIP 信令监听端口
    udp-port: 5060
    # 对外公布的 IP（SDP/Contact 用），留空自动探测本机非回环地址
    public-ip: ""
    # 401 Digest 鉴权开关
    auth-enabled: true
    # 回铃背景音乐 wav（8k/16bit/单声道 PCM），留空用合成 450Hz 回铃音
    ringback-wav: ""
    # 通话录音
    record-enabled: true
    record-dir: data/sip-records
    # 抖动缓冲深度（毫秒）
    jitter-ms: 60
    # 振铃超时（秒）
    ring-timeout-seconds: 60
    # 单通通话最大时长（秒），0 不限制
    max-call-seconds: 3600
    # RTP 空闲超时（秒）：接通后连续无 RTP 即拆线（防客户端异常退出的僵尸会话），0 关闭
    rtp-idle-seconds: 30
    # 忙线提示音：主叫拨正在通话的分机时先应答并循环播放提示音 N 秒，然后服务器挂断主叫；0 = 直接回 486
    busy-prompt-seconds: 10
    # 忙线提示音 wav（8k/16bit/单声道，如"您拨打的用户正在通话中"），留空用合成忙音（嘟嘟嘟）
    busy-prompt-wav: ""
    # 挂断忙音时长（秒）：通话中任意一方挂机，另一方听忙音（嘟嘟嘟）10 秒后由服务器拆线，0 = 立即拆线
    busy-tone-seconds: 10
    # H.248（Megaco）网关控制，MGC 角色，UDP 文本编码
    h248-enabled: false
    h248-port: 2944
    # H.248 分机号 → 终结点 ID；带 @IP 时按 IP 匹配网关，不带则用任一已注册网关
    # 注意：不要与 SIP 分机号段冲突（2001+ 已用于 SIP 分机）
    h248-terminals:
      "7001": "AALN/1"
      "7002": "AALN/2"


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.PilotACS: info
    # 压掉框架噪音：DispatcherServlet 初始化、Tomcat 启动、连接池刷屏等只留 WARN 以上
    org.springframework: warn
    org.apache.catalina: warn
    org.apache.tomcat: warn
    org.apache.coyote: warn
    com.baomidou.mybatisplus: warn
    com.zaxxer.hikari: warn
  pattern:
    # 去掉时间中的 T，改为空格分隔
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS"
  file:
    # 相对路径：以运行目录为基准，start.bat 在 target 下启动，即 target/logs/acs.log
    name: logs/PilotACS-log.log
  logback:
    rollingpolicy:
      # 按天滚动，单文件 20MB，保留 30 天
      file-name-pattern: logs/PilotACS-%d{yyyy-MM-dd}.%i.log
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
