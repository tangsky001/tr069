server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 5m
      cookie:
        http-only: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 400
      min-spare: 40
  max-http-request-header-size: 16KB

spring:
  application:
    name: acs
  mvc:
    servlet:
      load-on-startup: 1
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    # ---------- MySQL：台账 / 账号 / 任务 / 审计 / 日志 ----------
    mysql:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://127.0.0.1:3306/tr_acs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&createDatabaseIfNotExist=true
      username: root
      password: Qq123456
      hikari:
        pool-name: mysqlPool
        minimum-idle: 2
        maximum-pool-size: 20
        connection-test-query: SELECT 1
    # ---------- SQLite：仅光猫适配数据（能力树 / 参数映射 / 命中记录）----------
    sqlite:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: org.sqlite.JDBC
      jdbc-url: jdbc:sqlite:./data/tr069_tpl.pack
      username: ""
      password: ""
      hikari:
        pool-name: sqlitePool
        minimum-idle: 1
        maximum-pool-size: 3
        connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data-mysql.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# ============================ ACS 业务配置 ============================
acs:
  # CPE 上报路径（多个入口都映射到同一个协议处理器）
  cwmp-paths: /cwmp,/ACS-server/ACS,/tr069,/tr069/prov
  # 对外可达地址，用于 Download 的 URL 拼接
  public-url: http://127.0.0.1:8888
  # 文件下载是否要求 CPE 带账号密码
  file-auth-used: false
  # 未适配型号是否自动采集能力树入库（SQLite）
  discovery-mode: true
  # 并发下载上限
  concurrent-download-limit: 100
  # 心跳超时宽限（秒）
  periodic-timeout-margin: 120
  # 云端同步（预留）
  cloud-sync: false
  auth:
    # CPE -> ACS 认证：none | basic ；账号密码写成 auto/留空表示免认证
    method: basic
    cpe-to-acs-username: auto
    cpe-to-acs-password: auto
    # ACS -> CPE（连接请求 / kick）账号密码
    acs-to-cpe-username: itms
    acs-to-cpe-password: itms
  # 会话与任务超时
  session-timeout-seconds: 180
  task-timeout-seconds: 600
  # 默认管理员（首次启动自动创建）
  default-admin-username: admin
  default-admin-password: admin123
  jwt:
    secret: acs-tr069-secret-please-change-me-0123456789
    expire-seconds: 86400

device:
  # 超过该时长没有任何通信则判定离线（秒）
  online-check-interval: 120
  provision:
    # 收到 Inform 后把 ACS 地址与上报间隔写回设备
    enabled: true
    inform-interval-seconds: 300
    acs-url: http://127.0.0.1:8888/ACS-server/ACS
    connection-request-username: itms
    connection-request-password: itms

syslog:
  enabled: true
  # 非 root 运行建议用高端口，Windows 可直接用 514
  port: 5141
  bind: 0.0.0.0
  # 日志保留天数
  keep-days: 7

logging:
  level:
    root: INFO
    com.acsr.acs: INFO
    com.acsr.acs.cwmp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
