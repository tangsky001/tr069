# =============================================================================
# 光猫（CPE）适配档案示例
# -----------------------------------------------------------------------------
# 新增一款光猫：复制本文件，改名为 <厂商-型号>.yaml，修改匹配规则后保存即可。
# 保存后服务会在约 1 秒内自动加载，也可以调用 POST /api/worklist/reload 立即生效。
#
# 匹配规则说明：
#   - 每个字段都支持 Java 正则表达式
#   - 字段留空 = 不参与匹配（视为通过）
#   - 全部字段留空的档案不会被匹配（防止误命中）
#   - 多个档案同时命中时，priority 数值小的优先
# =============================================================================

key: example-huawei-hg8245
name: 示例-华为HG8245-电信v3.0
isp: CT
version: v3.0
priority: 100

# 该型号光猫上报所用的 ACS 端口（厂商出厂固化的值，不同厂商/批次常常不同）。
# 该端口必须出现在 acs.cwmp.listen-ports 中，否则启动时日志会告警。
acsPort: 9090

match:
  # 厂商（Inform 中 DeviceId.Manufacturer）
  manufacturer: "Huawei"
  # OUI，即序列号前 6 位
  oui: "A0B1C2"
  # 产品类别
  productClass: "HG8245"
  # 软件版本，支持正则
  softwareVersion: "^V3R0"
  # 精确到单台设备时使用，一般留空
  serialNumber: ""

capability:
  # 设备支持的 CWMP 方法，留空表示不校验
  supportedRpc:
    - SetParameterValues
    - GetParameterValues
    - GetParameterNames
    - AddObject
    - DeleteObject
    - Reboot
    - Download
    - FactoryReset
  # 单次请求携带的参数个数上限，0 表示不限
  maxParametersPerRequest: 64
  supportParameterAttributes: true
  supportDuStateChange: false
  # 部分设备下发后需要间隔，单位毫秒
  delayAfterSetMillis: 0
  setRetryTimes: 1
  # 少数设备 Inform 上报的参数列表残缺，可忽略
  ignoreInformParameterList: false

auth:
  # ACS 反向连接时使用的账号，留空则使用全局默认账号
  acsToCpeUsername: "itms"
  acsToCpePassword: "itms"
  requireRpcMethodsProbe: false

# -----------------------------------------------------------------------------
# 标准参数名 -> 该设备上的真实 TR069 路径
# 工单模板里统一使用左侧的标准名，由本表翻译成设备实际路径，
# 这样同一个业务工单可以在不同厂商设备间复用。
# -----------------------------------------------------------------------------
parameterAliases:
  WANConnectionDevice: InternetGatewayDevice.WANDevice.1.WANConnectionDevice
  LANDevice: InternetGatewayDevice.LANDevice
  WLANConfiguration: InternetGatewayDevice.LANDevice.1.WLANConfiguration

# -----------------------------------------------------------------------------
# 设备特有的行为开关，取值可以是 boolean / 数字 / 字符串，由具体执行器解释
# -----------------------------------------------------------------------------
quirks:
  # 下发 WAN 参数后是否必须先重启才生效
  rebootBeforeWanApply: false
  # 部分设备不支持在同一会话内连续 AddObject
  separateSessionPerAddObject: false
  # 下发失败时的额外等待(毫秒)
  extraRetryDelayMillis: 500

# -----------------------------------------------------------------------------
# 首次注册（0 BOOTSTRAP）时要额外下发的动作
# -----------------------------------------------------------------------------
bootstrapActions:
  - comment: 设置反向连接的认证账号
    parameter: InternetGatewayDevice.ManagementServer.Username
    value: itms
  - comment: 设置反向连接的认证口令
    parameter: InternetGatewayDevice.ManagementServer.Password
    value: itms
